- name: Asegurarse que python esta instalado
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - acl
    state: present
    update_cache: yes
- name: Crear usuario para el servicio de la API
  user:
    name: "{{ app_user}}"
    system: yes
    shell: /bin/bash
    state: present
- name: Crear directorio para la aplicación
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'
- name: Copiar archivo main.py al servidor
  copy:
    src: "../../../../app/{{ main_file }}"
    dest: "{{ app_dir }}/{{ main_file }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'
- name: Copiar requirements.txt al servidor
  copy:
    src: "../../../../app/requirements.txt"
    dest: "{{ app_dir }}/requirements.txt"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'
- name: Crear entorno virtual e instalar dependencias
  pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv
  become_user: "{{ app_user }}"
- name: Configurar el archivo de servicio systemcd
  template:
    src: api-main-py.service.j2
    dest: /etc/systemd/system/{{ service_name }}.service
  notify:
    - Reiniciar servicio api-main-py
- name: Iniciar y habilitar el servicio
  systemd:
    name: "{{ service_name }}"
    state: started
    enabled: yes
